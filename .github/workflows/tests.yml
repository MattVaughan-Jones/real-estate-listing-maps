# Runs the test suite on every pull request and on every push to main, so a contribution's
# results show on the pull request before it's reviewed.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci # installs exactly the versions in package-lock.json
      - run: npm test
