<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Source for the extension's icon. After editing, regenerate the PNGs that manifest.json uses
    (16, 32, 48 and 128px) from this folder, using the resvg renderer in a temporary folder:
      mkdir -p /tmp/icon-renderer && cd /tmp/icon-renderer && npm install @resvg/resvg-js@2.6.2
      cd - && node -e "
        const { Resvg } = require('/tmp/icon-renderer/node_modules/@resvg/resvg-js');
        const fs = require('fs'); const svg = fs.readFileSync('listing-maps-icon.svg', 'utf8');
        for (const size of [16, 32, 48, 128]) fs.writeFileSync('listing-maps-icon-' + size + '.png',
          new Resvg(svg, { fitTo: { mode: 'width', value: size } }).render().asPng());"
  -->
  <defs>
    <clipPath id="map-tile-shape">
      <rect x="4" y="4" width="120" height="120" rx="26"/>
    </clipPath>
  </defs>
  <!-- Map tile: background, river and roads, clipped to the rounded square -->
  <g clip-path="url(#map-tile-shape)">
    <rect x="4" y="4" width="120" height="120" fill="#e3f0dc"/>
    <path d="M0 94 C 30 82, 50 106, 84 94 S 118 76, 128 82 L128 104 C 108 100, 98 118, 72 116 S 28 104, 0 116 Z" fill="#b9dcf2"/>
    <path d="M0 38 L128 26" stroke="#ffffff" stroke-width="10"/>
    <path d="M24 0 L36 128" stroke="#ffffff" stroke-width="8"/>
  </g>
  <!-- Pin, centred and large so it still reads at 16px -->
  <path d="M64 10 C 39 10, 21 28, 21 52 C 21 80, 64 120, 64 120 C 64 120, 107 80, 107 52 C 107 28, 89 10, 64 10 Z" fill="#d93a2b" stroke="#ffffff" stroke-width="5"/>
  <!-- House inside the pin head -->
  <path d="M64 28 L86 47 L80 47 L80 70 L48 70 L48 47 L42 47 Z" fill="#ffffff"/>
  <rect x="59" y="56" width="10" height="14" fill="#d93a2b"/>
</svg>
